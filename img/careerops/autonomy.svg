<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Autonomy ladder: triage is read only, conversation suggests, the browser agent acts inside fences, evaluation runs unattended as a documented exception, and nothing has full autonomy." xmlns:c2pa="http://c2pa.org/manifest">
<rect width="880" height="410" rx="16" fill="#ffffff"/>
<text x="40" y="46" font-size="21" font-weight="700" fill="#16233f" text-anchor="start">How much freedom each agent gets</text>
<text x="40" y="72" font-size="13.5" font-weight="400" fill="#55617a" text-anchor="start">Each agent sits as low on the ladder as its job allows. Submitting is never automated.</text>
<line x1="40" x2="840" y1="100" y2="100" stroke="#e6eaf0"/>
<text x="40" y="126" font-size="15" font-weight="700" fill="#16233f" text-anchor="start">Full autonomy</text>
<text x="40" y="145" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">Acts and commits on its own</text>
<text x="420" y="134" font-size="13" font-weight="400" fill="#8a94a8" text-anchor="start">Not used. Submitting stays with you.</text>
<line x1="40" x2="840" y1="158" y2="158" stroke="#e6eaf0"/>
<text x="40" y="184" font-size="15" font-weight="700" fill="#16233f" text-anchor="start">Unattended</text>
<text x="40" y="203" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">Runs without a human watching</text>
<rect x="420" y="170" width="164.79999999999998" height="34" rx="17" fill="#fff" stroke="#e3a12f" stroke-width="1.5"/>
<text x="434" y="192" font-size="13" font-weight="600" fill="#16233f" text-anchor="start">Evaluation workers</text>
<text x="596.8" y="192" font-size="12" font-weight="400" fill="#8a94a8" text-anchor="start">accepted exception, documented</text>
<line x1="40" x2="840" y1="216" y2="216" stroke="#e6eaf0"/>
<text x="40" y="242" font-size="15" font-weight="700" fill="#16233f" text-anchor="start">Acts, fenced</text>
<text x="40" y="261" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">Works on a live website inside hard limits</text>
<rect x="420" y="228" width="225.6" height="34" rx="17" fill="#e3a12f" stroke="#e3a12f" stroke-width="1.5"/>
<text x="434" y="250" font-size="13" font-weight="600" fill="#16233f" text-anchor="start">Form-filling browser agent</text>
<line x1="40" x2="840" y1="274" y2="274" stroke="#e6eaf0"/>
<text x="40" y="300" font-size="15" font-weight="700" fill="#16233f" text-anchor="start">Suggests</text>
<text x="40" y="319" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">Proposes, the human decides</text>
<rect x="420" y="286" width="240.79999999999998" height="34" rx="17" fill="#e3a12f" stroke="#e3a12f" stroke-width="1.5"/>
<text x="434" y="308" font-size="13" font-weight="600" fill="#16233f" text-anchor="start">Conversation with your agent</text>
<line x1="40" x2="840" y1="332" y2="332" stroke="#e6eaf0"/>
<text x="40" y="358" font-size="15" font-weight="700" fill="#16233f" text-anchor="start">Read only</text>
<text x="40" y="377" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">Reads named files, writes one</text>
<rect x="420" y="344" width="126.8" height="34" rx="17" fill="#e3a12f" stroke="#e3a12f" stroke-width="1.5"/>
<text x="434" y="366" font-size="13" font-weight="600" fill="#16233f" text-anchor="start">Triage prompt</text>
<line x1="40" x2="840" y1="390" y2="390" stroke="#e6eaf0"/>
<path d="M24 384 V108" stroke="#8a94a8" stroke-width="1.5"/><path d="M20 114 l4 -6 l4 6" fill="none" stroke="#8a94a8" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>