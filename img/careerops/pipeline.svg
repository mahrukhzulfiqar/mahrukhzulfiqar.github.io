<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Pipeline: discover with code, triage and evaluate with AI, prepare with code, fill with a fenced browser agent, and the candidate submits." xmlns:c2pa="http://c2pa.org/manifest">
<rect width="880" height="270" rx="16" fill="#ffffff"/>
