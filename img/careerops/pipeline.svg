<text x="192" y="168" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Triage</text>
<text x="192" y="188" font-size="11.5" font-weight="400" fill="#55617a" text-anchor="start">title + location</text>
<text x="243.0" y="240" font-size="11.5" font-weight="400" fill="#55617a" text-anchor="middle">Read 3 files, write 1</text>
