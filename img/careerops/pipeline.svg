<text x="332" y="188" font-size="11.5" font-weight="400" fill="#55617a" text-anchor="start">score, tailored CV</text>
<text x="383.0" y="240" font-size="11.5" font-weight="400" fill="#55617a" text-anchor="middle">Runs unattended</text>
