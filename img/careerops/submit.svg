<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Mock application form filled by the agent from the profile, with salary left as a stopped question, and the Submit button locked for the agent. Four guardrails listed alongside." xmlns:c2pa="http://c2pa.org/manifest">
<rect width="880" height="420" rx="16" fill="#ffffff"/>
<text x="40" y="46" font-size="21" font-weight="700" fill="#16233f" text-anchor="start">The agent fills the form. Only you can send it.</text>
<text x="40" y="72" font-size="13.5" font-weight="400" fill="#55617a" text-anchor="start">Every answer comes from your profile. Unknown questions stop the run instead of being guessed.</text>
<rect x="40" y="96" width="470" height="300" rx="14" fill="#f4f6f9" stroke="#dde3ea"/>
<text x="60" y="128" font-size="11.5" font-weight="400" fill="#55617a" text-anchor="start">Full name</text>
<rect x="60" y="134" width="430" height="22" rx="6" fill="#fff" stroke="#d5dce4"/>
<text x="70" y="149" font-size="12.5" font-weight="500" fill="#16233f" text-anchor="start">Test Candidate</text>
<circle cx="476" cy="145" r="7" fill="#e3f2e5"/><text x="476" y="149" font-size="10" font-weight="700" fill="#1d5a2a" text-anchor="middle">✓</text>
<text x="60" y="174" font-size="11.5" font-weight="400" fill="#55617a" text-anchor="start">Email</text>
<rect x="60" y="180" width="430" height="22" rx="6" fill="#fff" stroke="#d5dce4"/>
<text x="70" y="195" font-size="12.5" font-weight="500" fill="#16233f" text-anchor="start">test@example.com</text>
<circle cx="476" cy="191" r="7" fill="#e3f2e5"/><text x="476" y="195" font-size="10" font-weight="700" fill="#1d5a2a" text-anchor="middle">✓</text>
<text x="60" y="220" font-size="11.5" font-weight="400" fill="#55617a" text-anchor="start">CV</text>
<rect x="60" y="226" width="430" height="22" rx="6" fill="#fff" stroke="#d5dce4"/>
<text x="70" y="241" font-size="12.5" font-weight="500" fill="#16233f" text-anchor="start">cv.pdf  (checksum ok)</text>
<circle cx="476" cy="237" r="7" fill="#e3f2e5"/><text x="476" y="241" font-size="10" font-weight="700" fill="#1d5a2a" text-anchor="middle">✓</text>
<text x="60" y="266" font-size="11.5" font-weight="400" fill="#55617a" text-anchor="start">Work authorisation</text>
<rect x="60" y="272" width="430" height="22" rx="6" fill="#fff" stroke="#d5dce4"/>
<text x="70" y="287" font-size="12.5" font-weight="500" fill="#16233f" text-anchor="start">From profile: yes</text>
<circle cx="476" cy="283" r="7" fill="#e3f2e5"/><text x="476" y="287" font-size="10" font-weight="700" fill="#1d5a2a" text-anchor="middle">✓</text>
<text x="60" y="312" font-size="11.5" font-weight="400" fill="#55617a" text-anchor="start">Salary expectation</text>
<rect x="60" y="318" width="430" height="22" rx="6" fill="#fff" stroke="#e9b9b0"/>
<text x="70" y="333" font-size="12.5" font-weight="500" fill="#9a3412" text-anchor="start">Not in profile: run stopped</text>
<circle cx="476" cy="329" r="7" fill="#fde7e2"/><text x="476" y="333" font-size="10" font-weight="700" fill="#9a3412" text-anchor="middle">!</text>
<rect x="60" y="346" width="140" height="34" rx="17" fill="#16233f"/><text x="130" y="368" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Submit</text>
<rect x="190" y="338" width="26" height="26" rx="13" fill="#e3a12f"/><path d="M197 353 h12 v8 h-12z M199 353 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#16233f" stroke-width="1.6"/>
<rect x="550" y="106" width="6" height="52" rx="3" fill="#e3a12f"/>
<text x="568" y="124" font-size="14.5" font-weight="700" fill="#16233f" text-anchor="start">Click guard</text>
<text x="568" y="144" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">The agent's click refuses Submit, Send</text>
<text x="568" y="160" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">and Apply, in English and Danish.</text>
<rect x="550" y="178" width="6" height="52" rx="3" fill="#e3a12f"/>
<text x="568" y="196" font-size="14.5" font-weight="700" fill="#16233f" text-anchor="start">Own site only</text>
<text x="568" y="216" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">Navigation is limited to the posting's</text>
<text x="568" y="232" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">own website.</text>
<rect x="550" y="250" width="6" height="52" rx="3" fill="#e3a12f"/>
<text x="568" y="268" font-size="14.5" font-weight="700" fill="#16233f" text-anchor="start">Right file check</text>
<text x="568" y="288" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">The cover letter must name the right</text>
<text x="568" y="304" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">company before anything uploads.</text>
<rect x="550" y="322" width="6" height="52" rx="3" fill="#e3a12f"/>
<text x="568" y="340" font-size="14.5" font-weight="700" fill="#16233f" text-anchor="start">Stops, never guesses</text>
<text x="568" y="360" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">Authorisation, salary and diversity</text>
<text x="568" y="376" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">answers come from the profile or not at</text>
<text x="568" y="392" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">all.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>