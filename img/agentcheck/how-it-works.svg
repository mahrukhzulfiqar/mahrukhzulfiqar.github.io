<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Describe the agent, Claude judges facts per tool, fixed rules set the autonomy level, and an autonomy card shows gaps and fixes." xmlns:c2pa="http://c2pa.org/manifest">
<rect width="880" height="350" rx="16" fill="#fff"/>
<text x="40" y="46" font-size="21" font-weight="700" fill="#16233f" text-anchor="start">The model judges facts. Code sets the level.</text>
<text x="40" y="72" font-size="13.5" font-weight="400" fill="#55617a" text-anchor="start">Same principle as GridWise: AI where judgement is needed, plain rules for the decision, so every level can be explained.</text>
<rect x="40" y="100" width="190" height="128" rx="14" fill="#f4f6f9" stroke="#cfd6df" stroke-width="1.5"/>
<circle cx="64" cy="126" r="13" fill="#16233f"/><text x="64" y="131" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="56" y="166" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Describe the agent</text>
<text x="56" y="188" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">Tool list, MCP config or a</text>
<text x="56" y="204" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">spec with guardrails</text>
<path d="M233 164 h10" stroke="#8a94a8" stroke-width="1.5"/><path d="M240 160 l4 4 l-4 4" fill="none" stroke="#8a94a8" stroke-width="1.5"/>
<rect x="246" y="100" width="190" height="128" rx="14" fill="#fff" stroke="#16233f" stroke-width="1.5"/>
<circle cx="270" cy="126" r="13" fill="#16233f"/><text x="270" y="131" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<rect x="378" y="115" width="44" height="21" rx="10.5" fill="#16233f" stroke="#16233f"/><text x="400" y="130" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">AI</text>
<text x="262" y="166" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Judge the facts</text>
<text x="262" y="188" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">Claude (or offline rules)</text>
<text x="262" y="204" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">answers the four questions</text>
<text x="262" y="220" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">per tool</text>
<path d="M439 164 h10" stroke="#8a94a8" stroke-width="1.5"/><path d="M446 160 l4 4 l-4 4" fill="none" stroke="#8a94a8" stroke-width="1.5"/>
<rect x="452" y="100" width="190" height="128" rx="14" fill="#f4f6f9" stroke="#cfd6df" stroke-width="1.5"/>
<circle cx="476" cy="126" r="13" fill="#16233f"/><text x="476" y="131" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<rect x="584" y="115" width="44" height="21" rx="10.5" fill="#fff" stroke="#16233f"/><text x="606" y="130" font-size="11.5" font-weight="700" fill="#16233f" text-anchor="middle">Code</text>
<text x="468" y="166" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Set the level</text>
<text x="468" y="188" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">Fixed rules map facts to a</text>
<text x="468" y="204" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">level from 1 read only to</text>
<text x="468" y="220" font-size="12" font-weight="400" fill="#55617a" text-anchor="start">5 unattended</text>
<path d="M645 164 h10" stroke="#8a94a8" stroke-width="1.5"/><path d="M652 160 l4 4 l-4 4" fill="none" stroke="#8a94a8" stroke-width="1.5"/>
<rect x="658" y="100" width="190" height="128" rx="14" fill="#e3a12f" stroke="#e3a12f" stroke-width="1.5"/>
<circle cx="682" cy="126" r="13" fill="#16233f"/><text x="682" y="131" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="674" y="166" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Autonomy card</text>
<text x="674" y="188" font-size="12" font-weight="400" fill="#16233f" text-anchor="start">Gaps, fixes, EU AI Act</text>
<text x="674" y="204" font-size="12" font-weight="400" fill="#16233f" text-anchor="start">first pass, tests to write</text>
<text x="40" y="268" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">The four questions, per tool</text>
<rect x="40" y="290" width="6" height="20" rx="3" fill="#e3a12f"/><text x="56" y="305" font-size="13" font-weight="400" fill="#55617a" text-anchor="start">What does it cost if this action goes wrong?</text>
<rect x="450" y="290" width="6" height="20" rx="3" fill="#e3a12f"/><text x="466" y="305" font-size="13" font-weight="400" fill="#55617a" text-anchor="start">Can the action be undone?</text>
<rect x="40" y="320" width="6" height="20" rx="3" fill="#e3a12f"/><text x="56" y="335" font-size="13" font-weight="400" fill="#55617a" text-anchor="start">Who is affected: only us, or people outside?</text>
<rect x="450" y="320" width="6" height="20" rx="3" fill="#e3a12f"/><text x="466" y="335" font-size="13" font-weight="400" fill="#55617a" text-anchor="start">What guardrails are already in place?</text>
