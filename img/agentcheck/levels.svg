<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Five levels: 5 unattended, 4 acts within limits, 3 acts with approval, 2 suggests, 1 read only, with examples." xmlns:c2pa="http://c2pa.org/manifest">
<rect width="880" height="392" rx="16" fill="#fff"/>
<text x="40" y="46" font-size="21" font-weight="700" fill="#16233f" text-anchor="start">Five levels of freedom</text>
<text x="40" y="72" font-size="13.5" font-weight="400" fill="#55617a" text-anchor="start">Each action gets the highest level its risk allows, and no higher.</text>
<rect x="40" y="96" width="360" height="42" rx="10" fill="#16233f" stroke="#16233f" stroke-width="1.5"/>
<text x="56" y="123" font-size="14" font-weight="700" fill="#fff" text-anchor="start">5  Unattended</text>
<text x="420" y="114" font-size="12.5" font-weight="600" fill="#16233f" text-anchor="start">Acts on its own with no limits beyond its instructions</text>
<text x="420" y="131" font-size="12" font-weight="400" fill="#8a94a8" text-anchor="start">e.g. Reading public data</text>
<rect x="40" y="152" width="304" height="42" rx="10" fill="#16233f" stroke="#16233f" stroke-width="1.5"/>
<text x="56" y="179" font-size="14" font-weight="700" fill="#fff" text-anchor="start">4  Acts within limits</text>
<text x="420" y="170" font-size="12.5" font-weight="600" fill="#16233f" text-anchor="start">Acts on its own inside allow-lists, caps and logging</text>
<text x="420" y="187" font-size="12" font-weight="400" fill="#8a94a8" text-anchor="start">e.g. Creating an internal ticket</text>
<rect x="40" y="208" width="248" height="42" rx="10" fill="#e3a12f" stroke="#e3a12f" stroke-width="1.5"/>
<text x="56" y="235" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">3  Acts with approval</text>
<text x="420" y="226" font-size="12.5" font-weight="600" fill="#16233f" text-anchor="start">Acts after a person approves each action</text>
<text x="420" y="243" font-size="12" font-weight="400" fill="#8a94a8" text-anchor="start">e.g. Refunds, deletions, customer emails</text>
<rect x="40" y="264" width="192" height="42" rx="10" fill="#fff" stroke="#e3a12f" stroke-width="1.5"/>
<text x="56" y="291" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">2  Suggests</text>
<text x="420" y="282" font-size="12.5" font-weight="600" fill="#16233f" text-anchor="start">Drafts or proposes; a person carries it out</text>
<text x="420" y="299" font-size="12" font-weight="400" fill="#8a94a8" text-anchor="start">e.g. Shell commands in production, rejection emails</text>
<rect x="40" y="320" width="136" height="42" rx="10" fill="#fff" stroke="#e3a12f" stroke-width="1.5"/>
<text x="56" y="347" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">1  Read only</text>
<text x="420" y="338" font-size="12.5" font-weight="600" fill="#16233f" text-anchor="start">Can look, cannot change anything</text>
<text x="420" y="355" font-size="12" font-weight="400" fill="#8a94a8" text-anchor="start">e.g. Audit or analysis agents</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>